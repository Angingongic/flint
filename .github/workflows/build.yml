name: Build Flint installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare macOS Tauri toolchain
        if: runner.os == 'macOS'
        run: |
          # Hosted macOS includes Xcode, clang and the native WebKit SDK.
          # No GTK/WebKitGTK packages are needed on macOS.
          xcode-select -p
          xcrun --find clang
          xcrun --sdk macosx --show-sdk-path
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Install Node dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Frontend tests
        run: npm test
      - name: Verify build configuration branches
        run: node --test scripts/ci-build.test.mjs
      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build production frontend
        run: npm run build
      - name: Build native app and installers
        run: node scripts/ci-build.mjs
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Package macOS artifacts without losing executable permissions
        if: runner.os == 'macOS'
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          test -d "$bundle/macos/Flint.app"
          tar -czf ci-artifacts/Flint-universal.app.tar.gz -C "$bundle/macos" Flint.app
          cp "$bundle"/dmg/*.dmg ci-artifacts/
          # Updater archives and detached signatures only exist when enabled.
          find "$bundle" -type f \( -name '*.sig' -o -name '*.app.tar.gz' \) -exec cp {} ci-artifacts/ \;
      - name: Collect Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe ci-artifacts/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi ci-artifacts/
          Get-ChildItem src-tauri/target/release/bundle -Recurse -File -Filter *.sig | Copy-Item -Destination ci-artifacts/
      - name: Upload installers and signing status
        uses: actions/upload-artifact@v4
        with:
          name: Flint-${{ matrix.os }}-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Report signing status
        shell: bash
        run: cat ci-artifacts/BUILD-STATUS.txt >> "$GITHUB_STEP_SUMMARY"
