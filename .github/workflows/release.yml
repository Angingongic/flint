name: Release Flint
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: flint-production-release
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate production signing and versions
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e "if (!process.env.TAURI_SIGNING_PRIVATE_KEY) throw Error('Missing TAURI_SIGNING_PRIVATE_KEY secret; password may be empty')"
          node scripts/release-version.mjs check
      - name: Create a draft, never expose a partial update
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            test "$(gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft)" = true || { echo 'Refusing to overwrite a published release'; exit 1; }
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "Flint ${GITHUB_REF_NAME#v}" --notes-file RELEASE_NOTES.md
          fi
  build:
    needs: prepare
    strategy:
      fail-fast: false
      # Tauri action merges latest.json; serialize uploads to avoid lost entries.
      max-parallel: 1
      matrix:
        include:
          - platform: windows-latest
            args: '--bundles nsis,msi'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - name: Prepare macOS toolchain
        if: runner.os == 'macOS'
        run: |
          xcode-select -p
          xcrun --sdk macosx --show-sdk-path
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - run: npm ci
      - run: node scripts/release-version.mjs check
      - run: npm run lint
      - run: npm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: npm run build
      - uses: actions/github-script@v7
        id: notes
        with:
          script: core.setOutput('body', require('fs').readFileSync('RELEASE_NOTES.md', 'utf8'))
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tauriScript: node scripts/ci-build.mjs --release
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Validate all updater entries before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/verify-release.mjs
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --latest --notes-file RELEASE_NOTES.md
